name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "DEEPSEEK_API_KEY=" >> local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartgym-ai-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -1)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cp "$APK_FILE" "app/build/outputs/apk/debug/SmartGym-AI-${TAG_NAME}.apk"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SmartGym AI ${{ github.ref_name }}"
          body: |
            ## 📥 Tải APK
            Tải file APK bên dưới và cài đặt trên thiết bị Android 7.0+.

            ### Tính năng chính
            - 🤖 AI Coach phân tích sức khỏe bằng DeepSeek AI
            - 📸 Nhận diện tư thế tập luyện real-time (ML Kit Pose Detection)
            - 📊 Theo dõi tiến trình cân nặng, calo
            - 🥗 Quản lý dinh dưỡng hàng ngày
          files: app/build/outputs/apk/debug/SmartGym-AI-*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

